<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | India Bakery Expo 2026</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --gold: #D99A35;
            --gold-dark: #B87B1B;
            --gold-light: #FDF7EC;
            --dark: #1E242B;
            --muted: #556070;
            --cream: #FFF8F2;
            --font-heading: 'Frank Ruhl Libre', Georgia, serif;
            --font-body: 'Montserrat', sans-serif;
        }
        body {
            font-family: var(--font-body);
            background: radial-gradient(circle at 50% 20%, #FFFDF9 0%, #FFF3E6 60%, #FBEBD7 100%);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            position: relative;
        }
        /* Subtle background decorative shapes */
        body::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: rgba(217, 154, 53, 0.08);
            filter: blur(50px);
            pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: rgba(217, 154, 53, 0.08);
            filter: blur(50px);
            pointer-events: none;
        }

        .card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 2.25rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 70px -15px rgba(217, 154, 53, 0.2), 0 10px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(217, 154, 53, 0.2);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            overflow: hidden;
        }
        
        /* Top Accent Line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold-dark) 100%);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-wrap {
            margin-bottom: 1.25rem;
            display: inline-block;
            background: #FFFFFF;
            padding: 0.4rem 1.2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .logo-wrap img {
            height: 80px;
            object-fit: contain;
            display: block;

        }

        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.1rem auto;
            box-shadow: 0 12px 30px rgba(217, 154, 53, 0.38), 0 0 0 8px rgba(217, 154, 53, 0.12);
            animation: popIn 0.65s 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .icon-circle svg { stroke: #FFFFFF; width: 34px; height: 34px; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--gold-dark);
            background: var(--gold-light);
            padding: 0.35rem 1rem;
            border-radius: 999px;
            margin-bottom: 0.85rem;
            border: 1px solid rgba(217, 154, 53, 0.25);
        }
        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.6rem, 4.5vw, 2.1rem);
            font-weight: 800;
            color: var(--dark);
            line-height: 1.25;
            margin-bottom: 0.65rem;
        }
        h1 span {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            font-size: 0.92rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 1.35rem;
        }
        .sub strong {
            color: var(--dark);
        }

        .event-info-card {
            background: #FFF9F3;
            border: 1px solid rgba(217, 154, 53, 0.2);
            border-radius: 14px;
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .event-chip {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--dark);
        }
        .event-chip svg { color: var(--gold); }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.85rem 2.2rem;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #FFFFFF;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 999px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 25px rgba(217, 154, 53, 0.35);
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(217, 154, 53, 0.45);
        }

        .footer-note {
            margin-top: 1.25rem;
            font-size: 0.74rem;
            color: #8894A5;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            body { padding: 0.85rem; }
            .card { padding: 1.75rem 1.25rem; border-radius: 20px; }
            .logo-wrap img { height: 42px; }
            .icon-circle { width: 62px; height: 62px; margin-bottom: 0.85rem; }
            .icon-circle svg { width: 30px; height: 30px; }
            .event-info-card { flex-direction: row; gap: 0.75rem; padding: 0.75rem 1rem; }
            .btn-back { padding: 0.75rem 1.6rem; font-size: 0.85rem; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="assets/images/logo.png" alt="India Bakery Expo 26 Logo">
        </div>

        <div class="icon-circle">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>

        <div class="badge">Submission Successful</div>
        
        <h1>Thank You for <span>Registering!</span></h1>
        
        <p class="sub">Your registration for <strong>India Bakery Expo 2026</strong> has been received. Our team will reach out to you shortly.</p>

        <div class="event-info-card">
            <div class="event-chip">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>18–20 September 2026</span>
            </div>
            
            <div class="event-chip">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.19 4.11a2 2 0 0 1 2-1.72h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                <span>+91 88030 78030</span>
            </div>
        </div>

        <a href="index.html" class="btn-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Back to India Bakery Expo</span>
        </a>

        <div class="footer-note">
            India Bakery Expo 2026 · Organised by TAMILNADU BAKERS FEDERATION INDIA
        </div>
    </div>
</body>
</html>
