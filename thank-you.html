<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | India Bakery Expo 2026</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;800;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green: #D99A35;
            --green-dark: #B87B1B;
            --green-light: #FDF7EC;
            --gold: #D99A35;
            --dark: #252525;
            --muted: #666;
            --cream: #FFF8F2;
            --font-heading: 'Frank Ruhl Libre', Georgia, serif;
            --font-body: 'Montserrat', sans-serif;
        }
        body {
            font-family: var(--font-body);
            background-color: var(--cream);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 2rem 2.25rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 45px rgba(36, 78, 58, 0.1);
            border: 1px solid rgba(36, 78, 58, 0.1);
            animation: slideUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.1rem auto;
            box-shadow: 0 10px 25px rgba(36, 78, 58, 0.25);
            animation: popIn 0.6s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .icon-circle svg { stroke: #fff; width: 34px; height: 34px; }
        .badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--green);
            background: var(--green-light);
            padding: 0.25rem 0.85rem;
            border-radius: 999px;
            margin-bottom: 0.85rem;
        }
        h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            color: var(--dark);
            line-height: 1.2;
            margin-bottom: 0.65rem;
        }
        h1 span { color: var(--green); }
        .sub {
            font-size: 0.92rem;
            color: var(--muted);
            line-height: 1.55;
            margin-bottom: 1.2rem;
        }
        .divider {
            border: none;
            border-top: 1px solid rgba(36,78,58,0.1);
            margin: 1.2rem 0;
        }
        .event-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.4rem;
        }
        .event-chip {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--dark);
        }
        .event-chip svg { color: var(--green); }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.8rem;
            background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
            color: #fff;
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 999px;
            text-decoration: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 8px 25px rgba(36,78,58,0.25);
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(36,78,58,0.32);
        }
        .logo-wrap { margin-bottom: 1rem; }
        .logo-wrap img { height: 46px; object-fit: contain; }
        .footer-note {
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: rgba(37,37,37,0.4);
        }
        /* Submission type badge */
        .type-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gold);
            background: #FDF7EC;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            border: 1px solid rgba(217,154,53,0.3);
            margin-bottom: 1.2rem;
        }
        @media (max-width: 480px) {
            body { padding: 0.75rem; }
            .card { padding: 1.75rem 1.25rem; border-radius: 16px; }
            .event-info { flex-direction: row; gap: 0.75rem; justify-content: center; }
            .logo-wrap img { height: 40px; }
            .icon-circle { width: 60px; height: 60px; margin-bottom: 0.85rem; }
            .icon-circle svg { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="assets/images/logo.png" alt="India Bakery Expo 26 Logo">
        </div>

        <div class="icon-circle">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>

        <span class="badge">Submission Successful</span>
        <h1>Thank You for <span>Registering!</span></h1>
        <p class="sub">Your registration for <strong>India Bakery Expo 2026</strong> has been received. Our team will reach out to you shortly.</p>

        <!-- <hr class="divider"> -->

        <div class="event-info">
            <div class="event-chip">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                18–20 September 2026
            </div>
            
            <div class="event-chip">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.19 4.11a2 2 0 0 1 2-1.72h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                +91 88030 78030
            </div>
        </div>

        <a href="index.html" class="btn-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to India Bakery Expo
        </a>

        <p class="footer-note">India Bakery Expo 2026 &middot; Organised by TAMILNADU BAKERS FEDERATION INDIA</p>
    </div>
</body>
</html>
