<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | India Bakery Expo 2026</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --gold: #D99A35;
            --gold-dark: #B87B1B;
            --gold-light: #FDF7EC;
            --dark: #1E242B;
            --muted: #556070;
            --cream: #FFF8F2;
            --font-heading: 'Frank Ruhl Libre', Georgia, serif;
            --font-body: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-body);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #111B15;
        }

        /* Web Banner Background Image */
        .bg-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/images/web banner.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Dark Opacity Overlay */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(15, 23, 18, 0.78) 0%, rgba(10, 16, 12, 0.82) 100%);
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        /* HEADER BAR AT TOP */
        .header-bar {
            position: relative;
            z-index: 10;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            padding: 0.75rem 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .header-logo-img {
            height: 52px;
            width: auto;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .nav-list {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }
/* nav lins */
        .nav-link {
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            color: #2D3748;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.25s ease;
        }

        .nav-link:hover {
            color: var(--gold);
        }

        .btn-header {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.65rem 1.35rem;
            height: 42px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #FFFFFF;
            font-family: var(--font-body);
            font-size: 0.86rem;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(217, 154, 53, 0.35);
        }

        /* CENTER POPUP MAIN CONTENT */
        .main-wrapper {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }

        .card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 2.5rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            overflow: hidden;
        }

        /* Top Accent Line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold-dark) 100%);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-wrap {
            margin-bottom: 1.25rem;
            display: inline-block;
            background: #FFFFFF;
            padding: 0.4rem 1.2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .logo-wrap img {
            height: 48px;
            object-fit: contain;
            display: block;
        }

        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.1rem auto;
            box-shadow: 0 12px 30px rgba(217, 154, 53, 0.38), 0 0 0 8px rgba(217, 154, 53, 0.12);
            animation: popIn 0.65s 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }

        .icon-circle svg { stroke: #FFFFFF; width: 34px; height: 34px; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--gold-dark);
            background: var(--gold-light);
            padding: 0.35rem 1rem;
            border-radius: 999px;
            margin-bottom: 0.85rem;
            border: 1px solid rgba(217, 154, 53, 0.25);
        }

        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 800;
            color: var(--dark);
            line-height: 1.2;
            margin-bottom: 0.4rem;
        }

        .sub-heading {
            font-size: clamp(1.2rem, 3.5vw, 1.45rem);
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 1.25rem;
        }

        .sub {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 1.75rem;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
        }

        .sub strong {
            color: var(--dark);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.75rem 2.5rem;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #FFFFFF;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 999px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 25px rgba(217, 154, 53, 0.35);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(217, 154, 53, 0.45);
        }

        .footer-note {
            margin-top: 1.25rem;
            font-size: 0.74rem;
            color: #8894A5;
            font-weight: 500;
        }

        @media (max-width: 900px) {
            .nav-list { display: none; }
            .bg-banner { background-image: url('assets/images/image copy1.png'); background-size: cover; }
            .header-bar { padding: 0.6rem 1rem; }
            .header-logo-img { height: 42px; }
            .btn-header { display: none !important; }
            .card { padding: 1.75rem 1.25rem; border-radius: 20px; }
            .icon-circle { width: 62px; height: 62px; margin-bottom: 0.85rem; }
            .icon-circle svg { width: 30px; height: 30px; }
            .btn-back { padding: 0.75rem 2.2rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <!-- Full Background Banner Image -->
    <div class="bg-banner"></div>
    
    <!-- Dark Opacity Overlay -->
    <div class="bg-overlay"></div>

    <!-- Header Bar at Top -->
    <header class="header-bar">
        <a href="index.html" class="logo-group">
            <img src="assets/images/logo.png" alt="India Bakery Expo ’26 Logo" class="header-logo-img">
            <img src="assets/images/logo4.png" alt="TNBF Expo Secondary Logo" class="header-logo-img">
        </a>

        <ul class="nav-list">
            <li><a href="index.html#hero" class="nav-link">Home</a></li>
            <li><a href="index.html#about" class="nav-link">About</a></li>
            <li><a href="index.html#aims" class="nav-link">Aims</a></li>
            <li><a href="index.html#highlights" class="nav-link">Highlights</a></li>
            <li><a href="index.html#exhibitors" class="nav-link">Exhibitors</a></li>
        </ul>

        <a href="index.html" class="btn-header">
            <span>Register / Enquiry</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
        </a>
    </header>

    <!-- Centered Modal Popup Card -->
    <div class="main-wrapper">
        <div class="card">
            <div class="icon-circle">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>

            <h1>Thank You!</h1>
            <h2 class="sub-heading">Enquiry Submitted!</h2>
            
            <p class="sub">We have received your enquiry. Our representative will get in touch with you shortly.</p>

            <a href="index.html" class="btn-back">
                <span>Close</span>
            </a>
        </div>
    </div>
</body>
</html>
